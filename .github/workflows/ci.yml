name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  planner:
    name: planner MCP tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mcp/planner
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: mcp/planner/uv.lock
      - name: Install (locked)
        run: uv sync --frozen
      - name: Test
        run: uv run --frozen pytest -q
